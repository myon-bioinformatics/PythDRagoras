name: Pages

# Publishes the usage guide: docs/guide.page.json (a web-ui-page/1 spec, data only). The parent's reusable
# workflow renders it with the PySaiyanWeBoo commit pinned there — no HTML, CSS or JS lives in this repository.
# Pull requests build the page (an invalid spec fails there); only main deploys.
on:
  push:
    branches: [main]
    paths:
      - "docs/guide.page.json"
      - "docs/brand/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/guide.page.json"
      - "docs/brand/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages:
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-pages-static.yml@fbf433b296ec047f1c9acdf4d5d12c81ff7f59e8
    with:
      artifact_path: _site
      guide_page: docs/guide.page.json
      guide_assets: docs/brand/icon.png=icon.png docs/brand/favicon.png=favicon.png
